{% extends "base.html" %}
{% block title %}Напоминания{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
  <div>
    <h2 class="fw-bold mb-1">Напоминания</h2>
    <p class="text-muted mb-0">Не забывайте о важных делах</p>
  </div>
  <button class="btn btn-primary rounded-pill px-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#createReminderModal">
    <i class="bi bi-plus-lg me-1"></i> Добавить
  </button>
</div>

<div id="reminders-container">
  <!-- Блоки будут генерироваться в JS -->
</div>

<div id="empty-reminders" class="text-center py-5 d-none text-muted">
  <i class="bi bi-bell-slash display-4 opacity-50"></i>
  <p class="mt-3">У вас нет активных напоминаний.</p>
</div>

<!-- Модальное окно создания напоминания -->
<div class="modal fade" id="createReminderModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">Новое напоминание</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label text-muted small">Что нужно сделать?</label>
          <input type="text" id="reminder-text" class="form-control" placeholder="Например: Позвонить коллеге">
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small">Когда?</label>
          <input type="text" id="reminder-datetime" class="form-control" placeholder="дд.мм.гггг чч:мм">
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Отмена</button>
        <button type="button" id="save-reminder-btn" class="btn btn-primary rounded-pill px-4">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reminders.js') }}"></script>
{% endblock %}
