{% extends "base.html" %}
{% block title %}Мои посты{% endblock %}

{% block content %}
<div class="mb-4 mt-2">
  <h2 class="fw-bold mb-1">Мои посты</h2>
  <p class="text-muted mb-0">Статьи, созданные из ваших заметок</p>
</div>

<div id="posts-grid" class="row g-4">
  <!-- Посты будут вставляться здесь -->
</div>

<div id="empty-posts" class="text-center py-5 d-none text-muted bg-white rounded-3 shadow-sm border">
  <i class="bi bi-file-earmark-x display-4 opacity-50"></i>
  <p class="mt-3">У вас пока нет созданных постов. Перейдите в «Заметки» и создайте первый!</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/posts.js') }}"></script>
{% endblock %}
