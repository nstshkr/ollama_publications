{% extends "base.html" %}
{% block title %}Напоминания{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h4 class="fw-bold mb-3">Новое напоминание</h4>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label text-muted small">Что нужно сделать?</label>
              <input type="text" id="reminder-text" class="form-control" placeholder="Например: Позвонить коллеге">
            </div>
            <div class="col-md-4">
              <label class="form-label text-muted small">Когда?</label>
              <!-- Убрали datetime-local, теперь это обычный текст для Flatpickr -->
              <input type="text" id="reminder-datetime" class="form-control" placeholder="дд.мм.гггг чч:мм">
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button id="add-reminder-btn" class="btn btn-primary w-100">
                <i class="bi bi-bell"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <h4 class="fw-bold mb-3">Мои напоминания</h4>
      <div id="reminders-list" class="list-group shadow-sm">
        <!-- Напоминания будут здесь -->
      </div>
      <div id="empty-reminders" class="text-center py-5 d-none text-muted">
        <i class="bi bi-bell-slash display-4"></i>
        <p class="mt-3">У вас нет активных напоминаний.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reminders.js') }}"></script>
{% endblock %}
