{% extends "base.html" %}
{% block title %}Все публикации{% endblock %}

{% block content %}
<!-- Заголовок вместо градиента -->
<div class="d-flex justify-content-between align-items-end mb-4 mt-2">
  <div>
    <h2 class="fw-bold mb-1">Аннотации научных статей</h2>
    <p class="text-muted mb-0">Автоматически собранные публикации с локальной моделью Ollama</p>
  </div>
</div>

<!-- Фильтры -->
<div class="card border-0 shadow-sm mb-4 rounded-3">
  <div class="card-body p-3">
    <div class="row g-3 align-items-center">
      <div class="col-xl-4 col-lg-4 col-md-12">
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-search"></i></span>
          <input id="search" type="search" class="form-control border-start-0 ps-0" placeholder="Поиск по тексту, авторам...">
        </div>
      </div>
      
      <div class="col-xl-3 col-lg-3 col-md-6">
        <select id="author" class="form-select">
          <option value="">Все авторы</option>
          {% for a in authors %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
        </select>
      </div>

      <div class="col-xl-3 col-lg-3 col-md-6">
        <div class="input-group">
          <input type="text" id="date-from" class="form-control" placeholder="От">
          <input type="text" id="date-to" class="form-control" placeholder="До">
        </div>
      </div>

      <div class="col-xl-2 col-lg-2 col-md-12">
        <select id="sort" class="form-select">
          <option value="date_desc">Сначала новые</option>
          <option value="date_asc">Сначала старые</option>
          <option value="author">По автору</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-3 px-1">
  <span id="counter" class="text-muted small fw-bold text-uppercase tracking-wide"></span>
</div>

<div id="grid" class="row g-4"></div>

<div id="empty" class="text-center py-5 d-none bg-white rounded-3 shadow-sm border">
  <i class="bi bi-inbox display-4 text-muted opacity-50"></i>
  <p class="mt-3 text-muted">Ничего не найдено по вашему запросу</p>
</div>

<div id="loading" class="text-center py-5">
  <div class="spinner-border text-primary" role="status"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
