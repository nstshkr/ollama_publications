{# templates/no_db.html #}
{% extends "base.html" %}
{% block title %}База не найдена{% endblock %}
{% block content %}
<div class="container" style="max-width: 720px">
  <div class="alert alert-warning shadow-sm">
    <h1 class="h4"><i class="bi bi-database-exclamation me-2"></i>База данных не найдена</h1>
    <p class="mb-2">Сначала запустите сборщик данных из Google Таблицы:</p>
    <pre class="mb-2"><code>py -3 main.py</code></pre>
    <p class="mb-0">После этого обновите эту страницу.</p>
  </div>
</div>
{% endblock %}
