<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Публикации НИР{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="d-flex bg-light">

  <!-- Боковая панель (Sidebar) -->
  <aside class="sidebar bg-white border-end d-flex flex-column flex-shrink-0 p-3 shadow-sm">
    <a href="/" id="logo-trigger" class="d-flex align-items-center mb-4 text-decoration-none text-dark">
      <div class="bg-primary text-white rounded p-1 me-2">
        <i class="bi bi-journal-richtext fs-5 lh-1"></i>
      </div>
      <span class="fs-5 fw-bold">Ollama Pub</span>
    </a>
    <hr class="text-muted opacity-25">
    
    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li class="nav-item">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
          <i class="bi bi-house-door me-2"></i> Публикации
        </a>
      </li>
      <li class="nav-item">
        <a href="/notes" class="nav-link {% if request.path == '/notes' %}active{% endif %}">
          <i class="bi bi-journal-text me-2"></i> Заметки
        </a>
      </li>
      <li class="nav-item">
        <a href="/reminders" class="nav-link {% if request.path == '/reminders' %}active{% endif %}">
          <i class="bi bi-bell me-2"></i> Напоминания
        </a>
      </li>
    </ul>
    
    <div class="mt-auto text-muted small px-2">
      <i class="bi bi-info-circle me-1"></i> Версия 2.0
    </div>
  </aside>

  <!-- Основная область -->
  <div class="main-wrapper flex-grow-1 d-flex flex-column min-vh-100">
    
    <!-- Верхняя шапка (место для будущей регистрации) -->
    <header class="bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center shadow-sm">
      <div class="text-muted fw-medium">Рабочее пространство</div>
      <div>
        <!-- Здесь позже появится кнопка "Войти" -->
        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3">
          <i class="bi bi-person-circle me-1"></i> Войти
        </button>
      </div>
    </header>

    <!-- Контентная часть (скроллится) -->
    <main class="p-4 flex-grow-1">
      {% block content %}{% endblock %}
    </main>

  </div>

  <!-- Уведомления -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
  <!-- Холст для снега -->
  <canvas id="snow-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; display: none;"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="{{ url_for('static', filename='js/confetti.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
